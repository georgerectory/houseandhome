name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The SQL gate needs a real Postgres rather than a linter: the
    # triggers, the RLS policies and the allocation settlement are the
    # things most worth proving, and none of them can be checked
    # statically.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      # Runs early and cheaply: if a private extract or a source drawing
      # is staged, that is the one failure worth seeing before anything
      # else scrolls past.
      - name: Secrets
        run: npm run test:secrets
      - name: Unit tests
        run: npm run test:unit
      # The guard for the building model: every stage is a building, and
      # agrees with the drawings it was measured from. Pure Node, no
      # services, so it cannot fail for an environment reason.
      - name: Geometry
        run: npm run test:geometry
      - name: SQL schema and RLS
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGPASSWORD: postgres
          CI_PG: '1'
        run: bash tools/run-sql-tests.sh
      - name: Front end in a real browser
        run: npm run test:frontend

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
